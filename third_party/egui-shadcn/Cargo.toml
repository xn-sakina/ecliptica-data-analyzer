[package]
name = "egui-shadcn"
version = "0.1.0-vendored"
edition = "2024"
authors = ["Pawel Jankiewicz <pjankiewicz@gmail.com>"]
description = "Audited, vendored egui-shadcn snapshot for Ecliptica Data Analyzer"
